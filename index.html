<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Câu tường thuật · Cẩm nang &amp; bài tập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,700&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#0c3a3b;--g2:#0a2d33;--g3:#08222c;--card:rgba(8,48,50,.66);--ink:#fff3d4;--mut:#b9d3c7;--gold:#ffd77f;--gold2:#f0a94e;--lan:#ff9a3c;--pk:#ff8fb7;--line:rgba(255,225,150,.3);--ok:#8ff0be;--okbg:rgba(60,185,125,.3);--no:#ffb3c2;--nobg:rgba(230,80,110,.3);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 16px/1.7 "Be Vietnam Pro",system-ui,sans-serif;background:linear-gradient(180deg,var(--g1),var(--g2) 45%,var(--g3)) fixed;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.st{position:absolute;border-radius:50%;background:#fff6d8;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.5)}}
#moon{position:absolute;left:50%;top:40vh;width:min(86vmin,520px);aspect-ratio:1;margin-left:calc(min(86vmin,520px)/-2);border-radius:50%;background:radial-gradient(circle at 42% 40%,#fff9dc 0,#ffe9a3 55%,#ffd36f 100%);box-shadow:0 0 50px 20px rgba(255,235,160,.55),0 0 160px 60px rgba(255,220,120,.35);animation:br 7s ease-in-out infinite alternate;will-change:transform}
@keyframes br{to{box-shadow:0 0 70px 30px rgba(255,235,160,.7),0 0 200px 80px rgba(255,220,120,.4)}}
#moon i{position:absolute;border-radius:50%;background:rgba(240,150,70,.55)}
.mist{position:absolute;left:-10%;width:120%;height:90px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.18),transparent 70%);animation:ms 18s ease-in-out infinite alternate}
@keyframes ms{to{transform:translateX(6vw)}}
.ln{position:absolute;width:50px;filter:drop-shadow(0 0 16px rgba(255,150,60,.9));animation:ri linear infinite;will-change:transform}
@keyframes ri{0%{transform:translate(0,105vh) rotate(-4deg)}50%{transform:translate(20px,50vh) rotate(5deg)}100%{transform:translate(-10px,-30vh) rotate(-3deg)}}
main{position:relative;z-index:1}
.dp{font-family:"Playfair Display",Georgia,serif;font-weight:800}
.gd{background:linear-gradient(180deg,#fff0c0,#ffd27a 55%,#f0a94e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 14px rgba(255,200,100,.25))}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:70px 22px 0;text-align:left;position:relative}
.ttl{display:grid;grid-template-columns:auto auto;grid-template-areas:"a a" "b c";align-items:end;gap:0 10px;position:relative;z-index:2}
.ttl .a{grid-area:a;font-size:clamp(60px,18vw,120px);line-height:.95}
.ttl .b{grid-area:b;font:300 clamp(11px,3vw,15px)/1.5 "Be Vietnam Pro";letter-spacing:.2em;text-transform:uppercase;color:var(--ink);text-align:right;padding-bottom:20px}
.ttl .c{grid-area:c;font-size:clamp(76px,23vw,150px);line-height:.9;margin-top:-8px}
.hero .sub{margin:16px 0 0;padding:8px 18px;border-radius:18px;background:rgba(8,40,44,.74);font-size:14px;color:var(--ink);text-align:center;position:relative;z-index:2}
.hero .go{position:relative;z-index:2}
.go{display:inline-block;margin-top:18px;padding:10px 32px;border:1.5px solid var(--gold);border-radius:99px;background:rgba(8,48,50,.5);color:var(--gold);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;transition:background .25s,color .25s,transform .2s}
.go:hover{background:var(--gold);color:#17322f;transform:translateY(-3px)}
.art{position:absolute;left:0;right:0;bottom:0;height:300px;pointer-events:none}
.art svg{position:absolute}
#lotus{left:2%;bottom:30px;width:min(40vw,190px);animation:sw 6s ease-in-out infinite alternate;transform-origin:50% 100%}
#boat{left:50%;bottom:38px;width:min(44vw,210px);margin-left:calc(min(44vw,210px)/-2 + 8vw);animation:bt 5s ease-in-out infinite alternate}
#leafL{left:-30px;bottom:-24px;width:190px}#leafR{right:-40px;bottom:-30px;width:210px}
@keyframes sw{to{transform:rotate(3deg)}}@keyframes bt{to{transform:translateY(-8px) rotate(-2deg)}}
.river{position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(180deg,transparent,rgba(5,26,34,.9) 60%)}
.card{max-width:820px;margin:48px 16px;padding:34px 28px 26px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:28px;box-shadow:0 26px 50px -30px rgba(0,0,0,.8),inset 0 0 40px rgba(255,215,127,.06)}
@media(min-width:852px){.card{margin-left:auto;margin-right:auto}}
h2.dp{font-size:clamp(28px,6vw,40px);margin:0 0 10px;line-height:1.15}
h2.dp small{display:block;font:600 12px "Be Vietnam Pro";letter-spacing:.2em;text-transform:uppercase;color:var(--lan);margin-bottom:6px;-webkit-text-fill-color:var(--lan)}
h3{margin:22px 0 8px;font-family:"Playfair Display",serif;font-size:21px;color:var(--gold);font-weight:700}
p{margin:0 0 12px}.mut{color:var(--mut)}
b.g{color:var(--gold);font-weight:600}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}
td,th{padding:9px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;font-size:13px;color:var(--lan);border-top:0}
td:nth-child(even){color:var(--gold)}
.note{border-left:3px solid var(--lan);background:rgba(255,154,60,.1);padding:8px 14px;margin:12px 0;border-radius:0 14px 14px 0;font-size:15px}
ul.l{padding-left:20px;margin:6px 0 12px}ul.l li{margin-bottom:8px}
.ex{padding:10px 16px;margin:8px 0;border-radius:16px;background:rgba(255,255,255,.07);border-left:3px solid var(--gold);font-size:15px}
.stp{margin:12px 0;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.stp b{color:var(--gold)}.stp .y{display:block;margin-top:4px;color:var(--mut);font-size:14px}
.res{margin:12px 0;padding:12px 16px;border-radius:18px;background:linear-gradient(135deg,rgba(255,215,127,.22),rgba(255,154,60,.18));border:1px solid var(--gold);font-weight:600}
.q{padding:18px 0;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.qn{font-family:"Playfair Display",serif;font-style:italic;font-weight:700;color:var(--gold);margin-right:8px;font-size:22px}
.sent{font-size:17px;margin-bottom:10px}
.stt{color:var(--lan);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
textarea{flex:1 1 260px;min-width:0;font:inherit;padding:10px 16px;border-radius:20px;border:1.5px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);resize:none;height:66px}
textarea::placeholder{color:var(--mut)}
textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
textarea.ok{border-color:var(--ok);background:var(--okbg)}
textarea.no{border-color:var(--no);background:var(--nobg);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cb{padding:9px 24px;border:0;border-radius:99px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a2210;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s}
.cb:hover{transform:translateY(-2px)}
.fb{display:none;margin-top:12px;padding:12px 18px;border-radius:20px;font-size:15px}
.fb.show{display:block;animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.fb strong.ok{color:var(--ok)}.fb strong.no{color:var(--no)}
.fb .ans{font-size:17px;font-weight:600;margin:3px 0}
.reveal{opacity:0;transform:translateY(36px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
.pill{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;padding:7px 20px;border:1px solid var(--gold);border-radius:99px;background:rgba(8,40,44,.9);color:var(--gold);font-size:14px;font-weight:600}
.score{font-size:92px;line-height:1}
.center{text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div id="stars"></div><div id="moon"><i style="left:22%;top:24%;width:16%;height:12%"></i><i style="left:58%;top:16%;width:12%;height:10%"></i><i style="left:66%;top:48%;width:20%;height:16%"></i><i style="left:30%;top:60%;width:14%;height:11%"></i><i style="left:46%;top:38%;width:9%;height:8%"></i></div>
<div class="mist" style="top:62vh"></div><div class="mist" style="top:74vh;animation-direction:alternate-reverse"></div><div id="lns"></div></div>
<main>
<section class="hero reveal">
  <div class="ttl"><div class="a dp gd">Tường</div><div class="b">Kể lại<br>lời nói</div><div class="c dp gd">Thuật</div></div>
  <p class="sub">Câu tường thuật · Reported Speech<br>Cẩm nang ngữ pháp và 35 câu viết lại</p>
  <a class="go" href="#cn">Bắt đầu học</a>
  <div class="art"><div class="river"></div>
    <svg id="leafL" viewBox="0 0 200 140"><defs><radialGradient id="lf" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#7fd08a"/><stop offset="1" stop-color="#1f7a4a"/></radialGradient></defs><ellipse cx="90" cy="90" rx="95" ry="58" fill="url(#lf)"/><g stroke="#cdf0c4" stroke-width="1.4" opacity=".45" fill="none"><path d="M90 90L20 60M90 90L30 110M90 90L100 36M90 90L170 70M90 90L160 120"/></g></svg>
    <svg id="leafR" viewBox="0 0 200 140"><ellipse cx="110" cy="90" rx="95" ry="58" fill="url(#lf)"/><g stroke="#cdf0c4" stroke-width="1.4" opacity=".45" fill="none"><path d="M110 90L40 70M110 90L50 120M110 90L120 36M110 90L186 70"/></g></svg>
    <svg id="lotus" viewBox="0 0 160 150"><defs><linearGradient id="pt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc0d8"/><stop offset="1" stop-color="#f0709f"/></linearGradient></defs><path d="M80 150V92" stroke="#2f8f55" stroke-width="5"/><g fill="url(#pt)" stroke="#fff" stroke-opacity=".5"><ellipse cx="44" cy="84" rx="20" ry="38" transform="rotate(-62 44 84)"/><ellipse cx="116" cy="84" rx="20" ry="38" transform="rotate(62 116 84)"/><ellipse cx="58" cy="70" rx="19" ry="44" transform="rotate(-30 58 70)"/><ellipse cx="102" cy="70" rx="19" ry="44" transform="rotate(30 102 70)"/><ellipse cx="80" cy="64" rx="19" ry="46"/></g></svg>
    <svg id="boat" viewBox="0 0 220 130"><defs><linearGradient id="bt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a3a3a"/><stop offset="1" stop-color="#5a2226"/></linearGradient></defs><path d="M12 76Q110 120 208 76L192 104Q110 132 28 104Z" fill="url(#bt)"/><ellipse cx="64" cy="58" rx="22" ry="24" fill="#fff"/><circle cx="60" cy="30" r="14" fill="#fff"/><path d="M50 20C46-6 54-8 58 18M62 18C66-6 74-6 70 22" fill="#fff" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cx="57" cy="29" r="1.8" fill="#333"/><circle cx="150" cy="62" r="30" fill="#e9a84f"/><circle cx="150" cy="62" r="22" fill="none" stroke="#b4702c" stroke-width="2.5"/><path d="M150 46v32M134 62h32" stroke="#b4702c" stroke-width="2.5"/></svg>
  </div>
</section>
<div id="cn"></div>
<div id="bt"></div>
<section class="card center reveal"><h2 class="dp gd"><small>Tổng kết</small>Kết quả của bạn</h2><div class="score dp gd" id="final">0/35</div>
<p class="mut" id="brk"></p><p class="mut" id="msg">Làm hết 35 câu để xem tổng kết.</p><button class="go" onclick="location.reload()">Làm lại từ đầu</button></section>
</main>
<div class="pill" id="pill">Đúng 0 / 0</div>

<script>
const $=id=>document.getElementById(id);
const TB=(h,rows)=>`<div class="wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i%2===0?' style="color:inherit"':""}>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const SEC=(h,sub,body,id)=>`<section class="card reveal"${id?` id="${id}"`:""}><h2 class="dp gd"><small>${sub}</small>${h}</h2>${body}</section>`;
const STEPS=a=>a.map((s,i)=>`<div class="stp"><b>${i+1}. ${s[0]}</b> ${s[1]}<span class="y">Tại sao? ${s[2]}</span></div>`).join("");
const EXS=[
["Ví dụ 1","Câu trần thuật (Statement)","Lan said to Minh, “I am working on my project here today.”",[["Động từ tường thuật:","Đổi said to Minh thành told Minh (that) và bỏ dấu phẩy, ngoặc kép.","Khi có tân ngữ người nghe (Minh), cấu trúc told + O + (that) ngắn gọn và tự nhiên hơn said to + O. Từ that có thể giữ hoặc lược bỏ."],["Đổi đại từ và tính từ sở hữu:","Đổi I → she và my → her.","I và my là ngôi thứ nhất chỉ người nói. Người nói ở đây là Lan (nữ), nên khi ta kể lại dưới góc nhìn người thứ ba, phải chuyển sang ngôi thứ ba số ít giống cái là she và her."],["Lùi thì động từ:","Đổi am working (Hiện tại tiếp diễn) thành was working (Quá khứ tiếp diễn).","Động từ tường thuật told chia ở quá khứ, cho thấy hành động đang làm dự án của Lan diễn ra ở một thời điểm trong quá khứ. Đồng thời, chủ ngữ mới là she (số ít) nên dùng was."],["Đổi trạng từ nơi chốn và thời gian:","Đổi here → there và today → that day.","Lúc thuật lại, người kể không còn ở vị trí cũ của Lan và không còn ở đúng ngày hôm đó, nên phải chuyển sang mốc gián tiếp để tránh gây hiểu nhầm."]],"Lan told Minh (that) she was working on her project there that day."],
["Ví dụ 2","Câu hỏi Yes/No","The teacher asked me, “Did you finish your homework yesterday?”",[["Động từ tường thuật và từ nối:","Giữ The teacher asked me và thêm từ nối if hoặc whether.","Câu gốc là câu hỏi không có từ để hỏi (Yes/No). Tiếng Anh bắt buộc phải có if hoặc whether (mang nghĩa “liệu rằng”) để nối mệnh đề tường thuật với nội dung câu hỏi."],["Bỏ đảo ngữ và trợ động từ:","Bỏ Did, chuyển cấu trúc câu hỏi sang trật tự câu khẳng định S + V, cuối câu đổi dấu ? thành dấu chấm.","Câu tường thuật là câu kể lại việc ai đó đã hỏi gì, không phải câu trực tiếp đặt câu hỏi cho người nghe, nên tuyệt đối không đảo trợ động từ lên trước chủ ngữ."],["Đổi đại từ:","Đổi you → I và your → my.","Ngôi thứ hai (you/your) chỉ người nghe. Tân ngữ người nghe trong mệnh đề chính là me (tôi), nên phải chuyển về chủ ngữ I và sở hữu my."],["Lùi thì động từ:","Đổi Did … finish (Quá khứ đơn) thành had finished (Quá khứ hoàn thành).","Việc làm bài tập xảy ra trước cả thời điểm giáo viên hỏi trong quá khứ (một hành động xảy ra trước một mốc quá khứ khác), nên lùi từ Quá khứ đơn xuống Quá khứ hoàn thành."],["Đổi trạng từ thời gian:","Đổi yesterday → the day before (hoặc the previous day).","“Hôm qua” là ngày trước ngày giáo viên hỏi, không phải hôm qua tính theo ngày hôm nay của người kể."]],"The teacher asked me if/whether I had finished my homework the day before."],
["Ví dụ 3","Câu hỏi có từ để hỏi (Wh-Question)","Nam asked Hoa, “Where will you go next weekend?”",[["Giữ nguyên từ để hỏi:","Dùng lại where làm từ nối, không thêm that hay if.","Trong câu hỏi Wh-, bản thân từ để hỏi (where, what, when, why, how…) đã giữ chức năng liên từ nối hai mệnh đề."],["Đổi đại từ:","Đổi you → she.","you là ngôi thứ hai hướng đến người nghe là Hoa (nữ)."],["Đưa về trật tự khẳng định và lùi thì:","Đổi will you go thành she would go.","Phải đặt chủ ngữ she đứng trước động từ (xóa bỏ đảo ngữ của câu hỏi trực tiếp) và lùi will → would vì động từ asked ở quá khứ."],["Đổi trạng từ thời gian:","Đổi next weekend → the following weekend (hoặc the weekend after).","Mốc “cuối tuần tới” phụ thuộc vào thời điểm nói ban đầu của Nam, cần đổi sang mốc tương đối trong quá khứ."]],"Nam asked Hoa where she would go the following weekend."],
["Ví dụ 4","Câu mệnh lệnh / yêu cầu phủ định (Imperative)","My mother said to me, “Don’t stay up too late tonight!”",[["Chọn động từ tường thuật:","Đổi said to me thành told me (hoặc reminded me / advised me tùy mức độ nhấn mạnh).","Khi tường thuật mệnh lệnh hoặc lời nhắc nhở, ta không dùng mệnh đề that + S + V mà dùng cấu trúc động từ tường thuật đi kèm tân ngữ và động từ nguyên mẫu có to."],["Chuyển dạng mệnh lệnh phủ định:","Đổi Don’t stay thành not to stay.","Cấu trúc cố định của câu mệnh lệnh phủ định trong lời nói gián tiếp là V + O + not to + V nguyên mẫu (từ phủ định not luôn đứng trước to và không chia thì động từ)."],["Đổi trạng từ thời gian và dấu câu:","Đổi tonight → that night và bỏ dấu chấm than.","Thời điểm “tối nay” đã lùi về tối hôm mẹ nhắc nhở; câu tường thuật kết thúc bằng dấu chấm."]],"My mother told me not to stay up too late that night."]];

$("cn").innerHTML=
SEC("Câu tường thuật là gì?","Cẩm nang · 1",`<p><b class="g">Câu tường thuật (Reported Speech hay Indirect Speech, câu gián tiếp)</b> là cách thuật lại lời nói, câu hỏi, yêu cầu hoặc suy nghĩ của một người khác (hoặc của chính bản thân trước đó) theo góc nhìn của người kể lại. Khác với câu trực tiếp, câu tường thuật không trích dẫn nguyên văn và không sử dụng dấu ngoặc kép.</p>`+TB(["Tiêu chí","Câu trực tiếp (Direct)","Câu tường thuật (Reported)"],[["Mục đích","Trích dẫn nguyên văn từng chữ của người nói gốc.","Truyền đạt lại nội dung lời nói theo lời của người kể."],["Dấu câu","Có dấu phẩy (hoặc hai chấm), dấu ngoặc kép, có thể có dấu ? hoặc !.","Bỏ dấu ngoặc kép; cuối câu luôn kết thúc bằng dấu chấm (kể cả khi tường thuật câu hỏi)."],["Ngôi, thì và trạng từ","Giữ nguyên theo thời điểm và vị trí của người nói ban đầu.","Thường phải đổi đại từ, lùi thì động từ và đổi trạng từ chỉ thời gian, nơi chốn."],["Ví dụ","Minh said, “I like this book.”","Minh said (that) he liked that book."]]))+
SEC("Dùng câu tường thuật khi nào?","Cẩm nang · 2",`<ul class="l"><li><b class="g">Kể lại cuộc hội thoại hoặc thông tin đã nghe:</b> thuật lại cho người thứ ba biết ai đó đã nói, hỏi hoặc chia sẻ điều gì (lời giáo viên, đồng nghiệp, bạn bè).</li><li><b class="g">Truyền đạt yêu cầu, lời khuyên, lời hứa hoặc cảnh báo:</b> chuyển tiếp mệnh lệnh, chỉ dẫn hoặc lời nhắn mà không cần lặp lại đúng từng câu chữ.</li><li><b class="g">Viết báo cáo, biên bản và tin tức:</b> dùng trong báo chí, phỏng vấn, biên bản cuộc họp để tóm lược ý kiến một cách khách quan và trang trọng.</li><li><b class="g">Trích dẫn gián tiếp trong văn viết học thuật:</b> tổng hợp quan điểm của các nhà nghiên cứu hoặc tác giả trong bài luận, báo cáo hoặc bài thi chứng chỉ.</li></ul><div class="note"><b>Lưu ý về mốc thời gian:</b> phần lớn tình huống tường thuật diễn ra sau thời điểm câu nói gốc và tại một địa điểm khác. Chính sự chênh lệch về người kể, thời gian và không gian này là nguyên nhân của các quy tắc biến đổi ngữ pháp bên dưới.</div>`)+
SEC("Quy trình 5 bước","Cẩm nang · 3 · Bước 1 và Bước 2",`<h3 style="margin-top:0">Bước 1: Xác định loại câu và chọn cấu trúc động từ tường thuật</h3><p>Đọc phần lời nói trong ngoặc kép để nhận diện loại câu, chọn động từ tường thuật và từ nối thích hợp, đồng thời bỏ dấu phẩy và dấu ngoặc kép.</p>`+TB(["Loại câu trực tiếp","Cấu trúc tường thuật","Động từ phổ biến"],[["Câu trần thuật (Statement)","S + said (that) + S + V<br>S + told + O + (that) + S + V","said, told, explained, added, stated, replied"],["Câu hỏi Yes/No (không có từ để hỏi)","S + asked (+ O) + if / whether + S + V","asked, wanted to know, wondered, inquired"],["Câu hỏi Wh- (What, Where, When…)","S + asked (+ O) + Wh-word + S + V","asked, wanted to know, wondered"],["Câu mệnh lệnh / yêu cầu (Imperative)","Khẳng định: S + V + O + to-V<br>Phủ định: S + V + O + not to-V","told, asked, ordered, advised, reminded, warned"]])+`<h3>Bước 2: Đổi đại từ nhân xưng, tân ngữ và tính từ / đại từ sở hữu</h3><p>Xác định hai đối tượng ở mệnh đề chính: người nói (chủ ngữ) và người nghe (tân ngữ), rồi đổi ngôi.</p><ul class="l"><li><b class="g">Ngôi thứ nhất</b> (I, me, my, mine, myself / we, us, our, ours, ourselves): đổi theo <b>người nói</b> (chủ ngữ của mệnh đề tường thuật).</li><li><b class="g">Ngôi thứ hai</b> (you, your, yours, yourself / yourselves): đổi theo <b>người nghe</b> (tân ngữ của mệnh đề tường thuật). Nếu câu gốc không nêu người nghe, thường ngầm hiểu là me hoặc tùy ngữ cảnh.</li><li><b class="g">Ngôi thứ ba</b> (he, she, it, they, him, her, them, his, their…): giữ nguyên.</li></ul>`)+
SEC("Bước 3","Lùi thì động từ (Backshifting)",`<p>Khi động từ tường thuật chia ở quá khứ (said, told, asked…), động từ trong mệnh đề được tường thuật phải lùi một bậc về quá khứ (áp dụng cho câu trần thuật và câu hỏi; câu mệnh lệnh dùng (not) to-V nên không lùi thì).</p>`+TB(["Trực tiếp","Tường thuật","Ví dụ nhanh"],[["Hiện tại đơn (V / V-s/es)","Quá khứ đơn (V2 / V-ed)","work / works → worked"],["Hiện tại tiếp diễn (am/is/are + V-ing)","Quá khứ tiếp diễn (was/were + V-ing)","is reading → was reading"],["Hiện tại hoàn thành (have/has + V3/ed)","Quá khứ hoàn thành (had + V3/ed)","have seen → had seen"],["Hiện tại hoàn thành tiếp diễn","Quá khứ hoàn thành tiếp diễn","has been waiting → had been waiting"],["Quá khứ đơn (V2 / V-ed)","Quá khứ hoàn thành (had + V3/ed)","bought → had bought"],["Quá khứ tiếp diễn (was/were + V-ing)","Quá khứ hoàn thành tiếp diễn","was sleeping → had been sleeping"],["Quá khứ hoàn thành (had + V3/ed)","Giữ nguyên (had + V3/ed)","had left → had left"],["Tương lai đơn (will + V)","Tương lai trong quá khứ (would + V)","will call → would call"],["Tương lai gần (am/is/are going to)","was/were going to","are going to → were going to"],["Động từ khuyết thiếu: can / may / must / shall","could / might / had to (bắt buộc); should (gợi ý) hoặc would (tương lai)","can swim → could swim; must go → had to go"]]))+
SEC("Bước 4 và Bước 5","Đổi trạng từ, rà soát câu",`<h3 style="margin-top:0">Bước 4: Đổi trạng từ chỉ thời gian, nơi chốn và từ chỉ định</h3><p>Khi thời điểm và không gian kể lại đã thay đổi so với lúc nói gốc, cần chuyển các từ chỉ định, trạng từ thời gian và nơi chốn tương ứng.</p>`+TB(["Trực tiếp","Tường thuật","Trực tiếp","Tường thuật"],[["this / these","that / those","yesterday","the day before / the previous day"],["here","there","tomorrow","the next day / the following day"],["now","then / at that time","last week / month","the week / month before"],["today","that day","next week / year","the following week / year"],["tonight","that night","… ago","… before / earlier"]])+`<h3>Bước 5: Kiểm tra trật tự từ, hòa hợp chủ – vị và dấu câu</h3><ul class="l"><li>Nếu là câu hỏi tường thuật, đã đưa về trật tự khẳng định <b>S + V</b> và bỏ trợ động từ do / does / did chưa?</li><li>Động từ chia có hòa hợp với chủ ngữ mới sau khi đổi ngôi không (am → was, were → was)?</li><li>Đã xóa hết dấu ngoặc kép và kết thúc câu bằng dấu chấm chưa?</li></ul>`)+
SEC("Ví dụ từng bước","Cẩm nang · 4 · Tại sao làm như vậy?",`<p>Bốn ví dụ minh họa trọn vẹn quy trình chuyển đổi trên 4 dạng câu trọng tâm, kèm giải thích bản chất của từng thao tác.</p>`)+

SEC("Lưu ý và ngoại lệ","Cẩm nang · 5",`<h3 style="margin-top:0">5.1. Các trường hợp KHÔNG lùi thì động từ</h3>`+TB(["Trường hợp","Giải thích ngắn","Ví dụ"],[["1. Động từ tường thuật ở hiện tại hoặc tương lai (says, has said, will say)","Mốc thời gian tường thuật không thuộc quá khứ, nên chỉ đổi đại từ và giữ nguyên thì.","He says, “I am tired.” → He says (that) he is tired."],["2. Sự thật hiển nhiên, chân lý khoa học","Nội dung luôn đúng ở mọi thời điểm nên giữ nguyên hiện tại đơn.","She said, “Water boils at 100°C.” → She said water boils at 100°C."],["3. Động từ khuyết thiếu không lùi thêm được (could, would, should, might, ought to, used to, had better)","Bản thân các từ này đã ở dạng quá khứ hoặc mang nghĩa giả định / khuyên nhủ nên giữ nguyên.","He said, “You should rest.” → He said I should rest."],["4. Câu điều kiện loại 2, loại 3 và cấu trúc giả định (wish, would rather, It’s time)","Các cấu trúc này vốn dùng thì quá khứ để chỉ tình huống không có thật, lùi nữa sẽ sai cấu trúc.","She said, “I wish I were taller.” → She said she wished she were taller."],["5. Lời nói vẫn còn đúng ở hiện tại (ngữ cảnh giao tiếp thực tế)","Nếu sự việc chưa thay đổi lúc kể lại, người bản xứ có thể giữ nguyên thì (bài thi ngữ pháp cơ bản vẫn ưu tiên lùi thì).","Tom said, “I live in Da Nang.” → Tom said he lives/lived in Da Nang."]])+`<h3>5.2. Các lỗi sai thường gặp cần tránh</h3><div class="note"><b>Nhầm lẫn giữa say và tell:</b> sau tell bắt buộc có tân ngữ (told me that…, không viết told to me hay told that). Sau say không đi trực tiếp với tân ngữ chỉ người (said that… hoặc said to me that…, không viết said me).</div><div class="note"><b>Quên bỏ đảo ngữ trong câu hỏi gián tiếp:</b> Sai: He asked me where did I live. Đúng: He asked me where I lived.</div><div class="note"><b>Giữ lại dấu chấm hỏi (?) ở cuối câu:</b> câu hỏi sau khi tường thuật đã trở thành mệnh đề tường thuật, nên cuối câu luôn dùng dấu chấm.</div><div class="note"><b>Dùng must máy móc:</b> must mang nghĩa bắt buộc ở hiện tại / tương lai thì đổi sang had to (hoặc would have to). Nếu must mang nghĩa suy đoán logic (hẳn là) hoặc quy định cấm đoán (mustn’t) thì giữ nguyên.</div>`)+
SEC("Kiến thức mở rộng","Cẩm nang · 6",`<h3 style="margin-top:0">6.1. Động từ tường thuật mang sắc thái nghĩa</h3><p>Thay vì lặp lại said hay told, tiếng Anh dùng các động từ thể hiện trực tiếp mục đích giao tiếp (hứa hẹn, xin lỗi, gợi ý, buộc tội, cảm ơn…).</p>`+TB(["Nhóm cấu trúc","Động từ tiêu biểu","Ví dụ chuyển đổi"],[["V + to-V","promise (hứa), agree (đồng ý), refuse (từ chối), offer (đề nghị giúp), threaten (đe dọa), decide","“I’ll pay you back tomorrow.” → He promised to pay me back the next day."],["V + O + (not) to-V","advise (khuyên), invite (mời), remind (nhắc), warn (cảnh báo), encourage, persuade, beg","“Would you like to join our club?” → She invited me to join their club."],["V + V-ing","suggest (gợi ý), admit (thừa nhận), deny (phủ nhận), regret (hối tiếc), recommend","“Let’s take a short break.” → He suggested taking a short break."],["V + giới từ + V-ing","apologize (to O) for (xin lỗi), insist on (khăng khăng), dream of (mơ ước), think of","“I’m sorry I arrived late.” → She apologized for arriving late."],["V + O + giới từ + V-ing","accuse O of (buộc tội), blame O for (đổ lỗi), congratulate O on (chúc mừng), thank O for (cảm ơn), warn O against, prevent / stop O from","“You broke my glasses!” → He accused me of breaking his glasses."]])+`<h3>6.2. Câu điều kiện, câu cảm thán và lời chúc</h3><ul class="l"><li><b class="g">Câu điều kiện:</b> loại 1 lùi thì như bình thường (hình thức trở nên giống loại 2). “If it rains, we will stay home.” → He said that if it rained, they would stay home. Loại 2 và loại 3 giữ nguyên thì, chỉ đổi đại từ và trạng từ nếu cần.</li><li><b class="g">Câu cảm thán:</b> thường dùng exclaim (that) hoặc say with surprise / delight (that) và chuyển về câu trần thuật chuẩn. “What a wonderful idea!” → She exclaimed that it was a wonderful idea.</li><li><b class="g">Lời chào và lời chúc:</b> dùng greet + O, wish + O + (lời chúc), say goodbye to + O. “Good luck with your exam!” → He wished me good luck with my exam.</li></ul><h3>6.3. Các chủ điểm nền tảng liên quan</h3><ul class="l"><li><b class="g">Hệ thống các thì và động từ bất quy tắc:</b> nền tảng bắt buộc của Bước 3. Nắm chắc bảng V2 / V3 giúp lùi thì nhanh và không sai dạng phân từ.</li><li><b class="g">Danh động từ và động từ nguyên mẫu (Gerunds & Infinitives):</b> liên kết với nhóm động từ tường thuật đặc biệt (promise to-V, deny V-ing, apologize for V-ing).</li><li><b class="g">Mệnh đề danh từ (Noun Clauses):</b> toàn bộ phần sau that / if / whether / Wh-word là một mệnh đề danh từ đóng vai trò tân ngữ cho động từ tường thuật. Hiểu bản chất này giúp bạn không bao giờ mắc lỗi đảo ngữ trong câu hỏi gián tiếp.</li></ul>`);

["“How long will it take us to get to the airport?” the passengers asked the driver.","The passengers asked the driver","The passengers asked the driver how long it would take them to get to the airport.","Đưa về trật tự S + V; will → would; us → them.",1],
["“Please turn off your mobile phones during the exam,” the supervisor said to the candidates.","The supervisor asked","The supervisor asked the candidates to turn off their mobile phones during the exam.","asked + O + to-V; bỏ please; your → their.",2],
["“Don’t touch those wet paintings!” the guard said to the children.","The guard told","The guard told the children not to touch those wet paintings.","Mệnh lệnh phủ định: told + O + not to-V; those giữ nguyên.",2],
["“Read the instructions carefully before starting,” the teacher said to us.","The teacher reminded","The teacher reminded us to read the instructions carefully before starting.","reminded + O + to-V.",2],
["“Don’t forget to water the plants while I’m away,” my aunt said to me.","My aunt reminded","My aunt reminded me to water the plants while she was away.","Don’t forget to-V → reminded + O + to-V; I’m → she was.",2],
["“You should drink more water and get enough sleep,” the doctor said to him.","The doctor advised","The doctor advised him to drink more water and get enough sleep.","Lời khuyên You should + V → advised + O + to-V.",2],
["“Could you help me carry this heavy box?” the old woman said to Nam.","The old woman asked","The old woman asked Nam to help her carry that heavy box.","Yêu cầu lịch sự Could you → asked + O + to-V; me → her; this → that.",2],
["“I’ll definitely return your dictionary next Monday,” Phong said to me.","Phong promised","Phong promised to return my dictionary {the following Monday|the next Monday}.","promise + to-V; your → my; next → the following.",3],
["“I’m really sorry I broke your favorite mug,” Mai said to her sister.","Mai apologized","Mai apologized to her sister for {breaking|having broken} her favorite mug.","apologize (to O) for + V-ing; your → her.",3],
["“Let’s organize a charity book fair this month,” the class monitor said.","The class monitor suggested","The class monitor suggested organizing a charity book fair that month.","Let’s + V → suggest + V-ing; this → that.",3],
["“I didn’t take any money from the drawer,” the employee said.","The employee denied","The employee denied {taking|having taken} any money from the drawer.","deny + V-ing / having V3 (mang nghĩa phủ nhận nên bỏ didn’t).",3],
["“You copied my essay!” Minh said to Khoa.","Minh accused","Minh accused Khoa of {copying|having copied} his essay.","accuse + O + of + V-ing; my → his.",3],
["“Congratulations! You passed the entrance exam with flying colors,” my uncle said to me.","My uncle congratulated","My uncle congratulated me on passing the entrance exam with flying colors.","congratulate + O + on + V-ing.",3],
["“The Earth revolves around the Sun,” the science teacher explained to the class.","The science teacher explained to the class that","The science teacher explained to the class that the Earth revolves around the Sun.","Ngoại lệ: chân lý khoa học luôn đúng → giữ nguyên hiện tại đơn.",3],
["“If I had more free time, I would learn to play the guitar,” Quang said.","Quang said that","Quang said that if he had more free time, he would learn to play the guitar.","Ngoại lệ: câu điều kiện loại 2 không lùi thì, chỉ đổi ngôi I → he.",3],
["“If it rains heavily tomorrow, we will cancel the picnic,” the team leader told us.","The team leader told us that","The team leader told us that if it rained heavily {the next day|the following day}, we would cancel the picnic.","Điều kiện loại 1 lùi thì thành hình thức loại 2; we giữ nguyên vì có us.",4],
["“Why don’t we go to the museum on Saturday?” Nga asked.","Nga suggested","Nga suggested going to the museum on Saturday.;;Nga suggested that they {should |}go to the museum on Saturday.","Why don’t we là câu gợi ý → suggest + V-ing (hoặc suggest that they (should) go…).",4],
["“You’d better not drive so fast on this slippery road,” she said to her husband.","She warned","She warned her husband {not to drive|against driving} so fast on that slippery road.","warn + O + not to-V hoặc warn + O + against + V-ing; this → that.",4],
["“Thank you very much for helping me fix my bicycle,” the boy said to the mechanic.","The boy thanked","The boy thanked the mechanic for helping him fix his bicycle.","thank + O + for + V-ing; me/my → him/his.",4],
["“I wish I spoke French fluently,” she says.","She says that","She says that she wishes she spoke French fluently.","Động từ tường thuật says ở hiện tại và cấu trúc wish đều không lùi thì; đổi I wish → she wishes.",4]];

const expand=s=>{const m=s.match(/\{([^}]*)\}/);if(!m)return[s];return m[1].split("|").flatMap(o=>expand(s.replace(m[0],o)))};
const show=s=>s.split(";;").map(x=>x.replace(/\{([^}]*)\}/g,(_,a)=>"("+a.split("|").map(t=>t||"–").join(" / ")+")")).join("<br>");
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/can't/g,"can not").replace(/won't/g,"will not").replace(/n't/g," not").replace(/'ll/g," will").replace(/[.,!?;“”"]/g,"").replace(/\s+/g," ").trim();
let ok=0,done=0;const pc=[0,0,0,0,0],PN=[8,8,6,8,5],pill=$("pill");
function upd(){pill.textContent=`Đúng ${ok} / ${done}`;if(done===35){$("brk").textContent=G.map((g,i)=>`Phần ${i+1}: ${pc[i]}/${PN[i]}`).join(" · ");$("final").textContent=ok+"/35";$("msg").textContent=ok>=32?"Xuất sắc, bạn tường thuật rất chắc tay.":ok>=25?"Khá tốt. Xem lại những câu sai để chắc hơn.":"Đọc lại cẩm nang rồi thử lại nhé."}}
let ctx;
function snd(g){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const n=ctx.currentTime;(g?[[660,0],[880,.12],[1175,.24]]:[[220,0],[165,.17]]).forEach(([f,o])=>{const s=ctx.createOscillator(),v=ctx.createGain();s.type=g?"sine":"sawtooth";s.frequency.value=f;v.gain.setValueAtTime(.0001,n+o);v.gain.exponentialRampToValueAtTime(g?.2:.12,n+o+.02);v.gain.exponentialRampToValueAtTime(.0001,n+o+.3);s.connect(v);v.connect(ctx.destination);s.start(n+o);s.stop(n+o+.32)})}catch(e){}}
function mark(g,p){done++;if(g){ok++;pc[p]++}snd(g);upd()}
function essay(e,n){const d=document.createElement("div");d.className="q";
  d.innerHTML=`<div class="sent"><span class="qn">${n}</span>${e[0]}</div><div class="row"><span class="stt">→ ${e[1]}</span></div><div class="row" style="margin-top:8px"><textarea aria-label="Câu ${n}" placeholder="Viết tiếp…"></textarea><button class="cb">Kiểm tra</button></div><div class="fb"></div>`;
  const ta=d.querySelector("textarea"),bt=d.querySelector(".cb"),fb=d.querySelector(".fb"),as=e[2].split(";;").flatMap(expand).map(norm);
  const run=()=>{let r=norm(ta.value);if(!r||ta.disabled)return;r=r.replace(/^that /,"");
    const g=as.includes(norm(e[1]+" "+r))||as.includes(r)||as.includes(norm(e[1]+" that "+r));
    ta.disabled=bt.disabled=true;ta.classList.add(g?"ok":"no");
    fb.className="fb show "+(g?"ok":"no");
    fb.innerHTML=`<strong class="${g?"ok":"no"}">${g?"Chính xác!":"Chưa đúng."}</strong><div class="ans">${show(e[2])}</div><div class="mut">Điểm ngữ pháp: ${e[3]} Các phương án sau dấu gạch chéo đều được chấp nhận.</div>`;
    mark(g,e[4])};
  bt.onclick=run;ta.onkeydown=ev=>{if(ev.key==="Enter"&&!ev.shiftKey){ev.preventDefault();run()}};return d}
const BT=$("bt");
G.forEach((g,gi)=>{const s=document.createElement("section");s.className="card reveal";s.innerHTML=`<h2 class="dp gd"><small>Phần ${gi+1} · bài tập tự luận</small>${g}</h2><p class="mut">${GN[gi]} Gõ tiếp sau phần gợi ý (có thể bỏ hoặc giữ “that”), nhấn Enter để kiểm tra.</p>`;
  E.forEach((e,i)=>{if(e[4]===gi)s.appendChild(essay(e,i+1))});BT.appendChild(s)});

/* bầu trời, lồng đèn */
$("stars").innerHTML=Array.from({length:60},(_,i)=>`<i class="st" style="left:${(i*37)%100}vw;top:${(i*53)%80}vh;width:${2+(i%3)}px;height:${2+(i%3)}px;animation-delay:${-(i%8)*.5}s"></i>`).join("");
const LN='<svg viewBox="0 0 60 110"><defs><radialGradient id="lg" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#ffe9a0"/><stop offset="1" stop-color="#ff8a2a"/></radialGradient></defs><path d="M12 20Q30 6 48 20L54 70Q30 82 6 70Z" fill="url(#lg)"/><rect x="18" y="68" width="24" height="8" fill="#e06a1a"/><path d="M30 76v20" stroke="#e06a1a" stroke-width="3"/><circle cx="30" cy="98" r="4" fill="#e06a1a"/></svg>';
$("lns").innerHTML=[[8,48,60],[72,34,75],[86,56,52],[30,40,90]].map(([l,w,d],i)=>`<div class="ln" style="left:${l}vw;width:${w}px;animation-duration:${d}s;animation-delay:${-i*17}s">${LN}</div>`).join("");
const mo=$("moon");
addEventListener("scroll",()=>{const y=scrollY;mo.style.transform=`translateY(${y*.18}px) scale(${1+Math.min(y,1200)/4000})`},{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.05});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
</script>
